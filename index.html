<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bbbbff"><meta name="apple-mobile-web-app-capable" content="yes">

</head><body><main aria-label="It's 5 o'clock">
<canvas id="clock" role="img" aria-label="Live clock: the hands stay fixed while the numbers move to show the time."></canvas>
</main><pre id="clock-error" hidden style="position:fixed;top:0;left:0;right:0;z-index:9;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff0f0;color:#900;padding:12px;font:13px monospace"></pre><script src="clock.js?v=5"></script><script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () {
navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));}).catch(function () {});
});
</script></body></html>
